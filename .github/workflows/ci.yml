name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:firefox
      - name: Package Chromium
        run: |
          mkdir -p artifacts
          pnpm zip
          cp .output/*-chrome.zip artifacts/
      - name: Package Firefox
        run: |
          pnpm zip:firefox
          cp .output/*-firefox.zip .output/*-sources.zip artifacts/
      - name: Verify ZIP contents
        run: |
          for archive in artifacts/*.zip; do
            unzip -tq "$archive"
          done
          for archive in artifacts/*-chrome.zip artifacts/*-firefox.zip; do
            unzip -p "$archive" manifest.json | python3 -m json.tool > /dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: artifacts/*.zip
          if-no-files-found: error
